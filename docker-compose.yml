version: '3.8'

services:
  # =======================================
  # Proxy SGP - API Principal (porta 3000)
  # =======================================
  proxy-sgp:
    build:
      context: ./proxy-sgp
      dockerfile: Dockerfile
    container_name: proxy-sgp
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - app-network

  # =======================================
  # API Service - BFF Admin (porta 9136)
  # =======================================
  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: api-service
    restart: always
    ports:
      - "9136:9136"
    environment:
      - NODE_ENV=production
    networks:
      - app-network

  # =======================================
  # Speed Test Server (porta 3001)
  # =======================================
  speed-test:
    build:
      context: ./speed_test_server
      dockerfile: Dockerfile
    container_name: speed-test
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    networks:
      - app-network

  # =======================================
  # Admin Panel - Web (porta 5173)
  # =======================================
  admin-painel:
    build:
      context: ./admin-painel
      dockerfile: Dockerfile
    container_name: admin-painel
    restart: always
    ports:
      - "5173:80"
    networks:
      - app-network
    depends_on:
      - proxy-sgp
      - api-service

  # =======================================
  # Portainer - Gestão Visual Docker
  # =======================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  portainer_data:
