services:
  # =========================================================================
  # CADDY — Reverse Proxy com HTTPS automático (Let's Encrypt)
  # =========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: painel_caddy
    restart: always
    ports:
      - "8080:8080"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend-proxy
      - api-service
      - landing-page
      - speed-test
      - apk-builder

  # =========================================================================
  # REDIS — Cache compartilhado e rate limiting persistente
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: painel_redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./admin-painel
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APK_BUILDER_URL: ${VITE_APK_BUILDER_URL:-/apk-builder}
        VITE_DOWNLOADS_URL: ${VITE_DOWNLOADS_URL:-}
        VITE_PANEL_URL: ${VITE_PANEL_URL:-}
    container_name: painel_frontend
    restart: always
    ports:
      - "8031:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - api-service
      - apk-builder
      - landing-page
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend-proxy:
    build:
      context: ./proxy-sgp
      dockerfile: Dockerfile
    container_name: painel_proxy_sgp
    restart: always
    ports:
      - "8030:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - ./proxy-sgp/.env
    environment:
      - DATABASE_URL=postgresql://sgp_user:sgp_password@postgres:5432/sgp_cache
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    container_name: painel_postgres
    restart: always
    environment:
      POSTGRES_USER: sgp_user
      POSTGRES_PASSWORD: sgp_password
      POSTGRES_DB: sgp_cache
    # SEGURANÇA: porta NÃO exposta publicamente — acesso apenas via rede Docker interna
    # Para acessar via host: docker exec -it painel_postgres psql -U sgp_user -d sgp_cache
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgp_user -d sgp_cache"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  landing-page:
    build:
      context: ./landing-page
      dockerfile: Dockerfile
    container_name: painel_landing
    restart: always
    ports:
      - "8032:80"
    volumes:
      - ./public_apks:/usr/share/nginx/html/public_apks:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  speed-test:
    build:
      context: ./speed_test_server
      dockerfile: Dockerfile
    container_name: painel_speedtest
    restart: always
    ports:
      - "8033:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: painel_api
    restart: always
    ports:
      - "8034:9136"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9136/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - ./api-service/.env
    volumes:
      # Service account montada de fora do repositório (não é commitada)
      - /home/app/.secrets/painel_provedores:/run/secrets:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  apk-builder:
    build:
      context: .
      dockerfile: Dockerfile.apkbuilder
    container_name: painel_apk_builder
    mem_limit: 4g
    mem_reservation: 1g
    restart: always
    ports:
      - "127.0.0.1:8035:8035"
    volumes:
      - /home/app/Android/Sdk:/home/app/Android/Sdk
      - /home/app/.secrets/painel_provedores/service-account.json:/home/app/.secrets/painel_provedores/service-account.json:ro
      - ./public_apks:/home/app/projects/painel_provedores/public_apks
      - ./apk/logs:/home/app/projects/painel_provedores/apk/logs
    working_dir: /home/app/projects/painel_provedores
    env_file:
      - ./api-service/.env
    environment:
      - APK_BUILDER_PORT=8035
      - PYTHON_BIN=python3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8035/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: painel_net

volumes:
  pgdata:
  caddy_data:
  caddy_config:
