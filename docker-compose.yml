services:
  frontend:
    build:
      context: ./admin-painel
      dockerfile: Dockerfile
    container_name: painel_frontend
    restart: always
    ports:
      - "8031:80"
    environment:
      - VITE_API_URL=http://168.194.13.18:8030

  backend-proxy:
    build:
      context: ./proxy-sgp
      dockerfile: Dockerfile
    container_name: painel_proxy_sgp
    restart: always
    ports:
      - "8030:3002"
    env_file:
      - ./proxy-sgp/.env

  landing-page:
    build:
      context: ./landing-page
      dockerfile: Dockerfile
    container_name: painel_landing
    restart: always
    ports:
      - "8032:80"
    volumes:
      - ./public_apks:/usr/share/nginx/html/public_apks:ro

  speed-test:
    build:
      context: ./speed_test_server
      dockerfile: Dockerfile
    container_name: painel_speedtest
    restart: always
    ports:
      - "8033:3001"

  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: painel_api
    restart: always
    ports:
      - "8034:9136"
    env_file:
      - ./api-service/.env
    volumes:
      # Service account montada de fora do repositório (não é commitada)
      - /home/app/.secrets/painel_provedores:/run/secrets:ro

  apk-builder:
    build:
      context: .
      dockerfile: Dockerfile.apkbuilder
    container_name: painel_apk_builder
    mem_limit: 4g
    mem_reservation: 1g
    restart: always
    ports:
      - "8035:8035"
    volumes:
      - .:/home/app/projects/painel_provedores
      - /home/app/Android/Sdk:/home/app/Android/Sdk
    working_dir: /home/app/projects/painel_provedores
    env_file:
      - ./api-service/.env
    environment:
      - APK_BUILDER_PORT=8035
      - PYTHON_BIN=python3

networks:
  default:
    name: painel_net
