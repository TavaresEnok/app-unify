server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # APKs publicados pelo apk-builder (F1). Montados fora de public_apks para
    # não depender de criar um ponto de montagem dentro de outro bind somente
    # leitura (isso derrubou o container no deploy de 2026-11-11).
    location /public_apks/f1/ {
        alias /srv/apk-f1/;
        try_files $uri =404;
    }

    # APKs antigos (links já distribuídos aos assinantes).
    location /public_apks/ {
        try_files $uri =404;
    }

    # Site estático (não é SPA): caminho desconhecido responde 404 de verdade,
    # para robôs e revisores da Play não confundirem com a página inicial.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }
}
