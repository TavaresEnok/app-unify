name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

jobs:
  web-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-painel/package-lock.json
            functions/package-lock.json
            api-service/package-lock.json
            proxy-sgp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix admin-painel
      - run: npm ci --prefix functions
      - run: npm ci --prefix api-service
      - run: npm ci --prefix proxy-sgp
      - run: npm run validate:web
      - run: npx playwright install --with-deps chromium
        working-directory: admin-painel
      - run: npm run test:e2e
        working-directory: admin-painel
      - run: npm run test:rules

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: app-flutter/unified
      - run: flutter pub get
        working-directory: app-flutter/admin_app
      - run: npm run validate:flutter

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: docker compose build frontend api-service backend-proxy
