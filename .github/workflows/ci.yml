name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-painel/package-lock.json
            functions/package-lock.json
            api-service/package-lock.json
            proxy-sgp/package-lock.json
            services/apk-builder/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix admin-painel
      - run: npm ci --prefix functions
      - run: npm ci --prefix api-service
      - run: npm ci --prefix proxy-sgp
      - run: npm ci --prefix services/apk-builder
      - run: npm run validate:web
      - run: npx playwright install --with-deps chromium
        working-directory: admin-painel
      - run: npm run test:e2e
        working-directory: admin-painel
      - run: npm run test:rules

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build frontend api-service backend-proxy speed-test
