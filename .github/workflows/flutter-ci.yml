name: Flutter App CI

on:
  push:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
  pull_request:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: dart analyze

    # - name: Run tests
    #   run: flutter test

    - name: Build APK (Debug for CI)
      run: flutter build apk --debug
