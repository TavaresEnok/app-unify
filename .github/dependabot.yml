version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /admin-painel
    schedule:
      interval: weekly
    groups:
      admin-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /api-service
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /proxy-sgp
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /app-flutter/unified
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /app-flutter/admin_app
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
