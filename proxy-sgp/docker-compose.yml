version: '3.8'

services:
  proxy-sgp:
    build: .
    container_name: proxy-sgp
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./cache.db:/app/cache.db
      - proxy-logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.docker.compose.project=painel-provedores"
      - "traefik.enable=false"

volumes:
  proxy-logs:
