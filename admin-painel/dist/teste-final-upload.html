<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teste de Upload Firebase</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMySTH49MgYk2TyuGxnLd0zOQ-Cah2l5A",
            authDomain: "app-ajust-provedor.firebaseapp.com",
            projectId: "app-ajust-provedor",
            storageBucket: "app-ajust-provedor.firebasestorage.app",
            messagingSenderId: "2735150999",
            appId: "1:2735150999:web:20a6ba508b510ce90a56d2"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        async function uploadTestFile() {
            const fileInput = document.getElementById('fileInput');
            const statusDiv = document.getElementById('status');
            const file = fileInput.files[0];

            if (!file) {
                statusDiv.innerText = 'Erro: Selecione um arquivo primeiro!';
                return;
            }

            // CORREÇÃO AQUI: Adicionadas aspas (backticks) para a string funcionar
            const filePath = `teste-isolado/${Date.now()}-${file.name}`;
            const storageRef = ref(storage, filePath);
            
            try {
                statusDiv.innerText = 'Iniciando upload...';
                console.log('Iniciando upload para:', filePath);

                const uploadResult = await uploadBytes(storageRef, file);
                const downloadURL = await getDownloadURL(uploadResult.ref);
                
                // CORREÇÃO AQUI: Adicionadas aspas (backticks) para a string funcionar
                statusDiv.innerHTML = `SUCESSO! <br> URL: <a href="${downloadURL}" target="_blank">${downloadURL}</a>`;
                console.log('Upload bem-sucedido!', downloadURL);

            } catch (error) {
                statusDiv.innerText = 'FALHA NO UPLOAD! Verifique o console (F12).';
                console.error('Erro no upload:', error);
            }
        }

        document.getElementById('uploadButton').addEventListener('click', uploadTestFile);
    </script>
</head>
<body>
    <h1>Teste de Upload Isolado para Firebase Storage</h1>
    <p>Este teste não usa React, Vite ou qualquer parte da sua aplicação. É um teste direto entre o seu navegador e o Firebase.</p>
    <input type="file" id="fileInput" accept="image/png, image/jpeg">
    <button id="uploadButton">Enviar Imagem</button>
    <hr>
    <h3>Status:</h3>
    <div id="status" style="font-family: monospace; background-color: #f0f0f0; padding: 10px; border-radius: 5px;">Aguardando ação...</div>
</body>
</html>
