resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_service_backend {
    zone api_service_backend 64k;
    server api-service:9136 resolve;
}

upstream apk_builder_backend {
    zone apk_builder_backend 64k;
    server apk-builder:8035 resolve;
}

upstream landing_page_backend {
    zone landing_page_backend 64k;
    server landing-page:80 resolve;
}

server {
    listen 80;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_min_length 1000;

    location /api/ {
        proxy_pass http://api_service_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /apk-builder/ {
        client_max_body_size 10m;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        proxy_pass http://apk_builder_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /public_apks/ {
        proxy_pass http://landing_page_backend/public_apks/;
        proxy_set_header Host $host;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
